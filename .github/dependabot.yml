version: 2
updates:
  # Base image (security fixes with no code change) -> "fix(deps)" commit -> PATCH release
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "fix(deps)" }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "fix(deps)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(ci)" }
